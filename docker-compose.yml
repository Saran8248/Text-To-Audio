version: '3.8'

services:
  text-to-audio:
    build: .
    container_name: text-to-audio-app
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./Backend/cache:/app/Backend/cache
      - ./Backend/history.json:/app/Backend/history.json
